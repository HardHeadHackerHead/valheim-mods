# The Tidecaller's Drowned Vault: a sea-temple that sank long ago and drained. Pale sea-worn stone, wreck timber rammed through it and
# banded where the tide stood, kelp, stone bells, sea-green fire. The tide is the puzzle: drowned hulls float low or high in the locks.
# A fight, a hub with a key wing and its gate, the anchor gallery, the Tide Locks, the Bellkeeper (mini boss), a sinking-hull crossing,
# a held sluice, Jarl Hafgrim's Tide Throne (the final boss) and his hoard.
name = "drowned"
title = "$dungeons_pack_drowned"
theme = "tidevault"
seed = 1
difficulty = "normal"
biome = "any"
environment = "Caves"
entrance_look = "drowned"
rooms = [16, 26]
max_size = [420, 160, 420]
min_uses = 6
music = "forestcrypt"
parkour = false
variants = 3

plan = [
  {id = "start", room = "entrance"},
  {id = "fight1", job = "fight"},
  {id = "hub1", job = "hub"},
  {id = "lever1", job = "lever", from = "hub1"},                      # a side wing: the key to the gate
  {id = "gate1", job = "gate", opens_with = "lever1", from = "hub1"},
  {id = "anchors", room = "anchors"},                                 # the anchor gallery: swinging anchors
  {id = "locks", room = "tidelocks"},                                 # the Tide Locks: the tide puzzle (5 pulls)
  {id = "plate1", job = "plate", variants = 2},
  {id = "bell", room = "bellshaft"},                                  # the Bellkeeper (mini boss)
  {id = "timing1", job = "timing"},
  {id = "throne", room = "throne"},                                   # Jarl Hafgrim, the Drowned (final boss)
  {id = "vault", room = "vault"},
]

signatures = ["wreckhall", "kelpway", "sunkenshrine", "shipshold", "cap_seal", "cap_silt", "lock_seal", "grotto", "shortcut_near", "shortcut_far", "throne_cap"]

[fill]
breather = 5
pillarhall = 3
corridor = 2
stairhall = 2
nook = 4
twolevers = 1
ambush = 1
timeddoor = 1

[shortcut]
near = "shortcut_near"
far = "shortcut_far"
far_step = "bell"

# Enemies: drowned dead and things of the shore, fitted to the land (a creature above the land's tier is never used).
[creatures.Meadows]
melee = ["Neck", "Skeleton_Meadows_noarcher", "Greyling"]
ranged = ["Skeleton_Meadows"]
elite = ["Skeleton_Meadows_noarcher"]

[creatures.BlackForest]
melee = ["Skeleton_NoArcher", "Skeleton_Poison", "Neck"]
ranged = ["Skeleton"]
flying = ["Ghost"]
elite = ["Skeleton_Poison"]

[creatures.Ocean]
melee = ["Skeleton_NoArcher", "Skeleton_Poison", "Neck"]
ranged = ["Skeleton"]
flying = ["Ghost"]
elite = ["Skeleton_Poison"]

[creatures.Swamp]
melee = ["Draugr", "Draugr_Elite", "Skeleton_Swamps_noarcher"]
ranged = ["Draugr_Ranged", "Skeleton_Swamps"]
flying = ["Wraith"]
elite = ["Draugr_Elite"]

[creatures.Mountain]
melee = ["Skeleton_Mountains_noarcher", "Draugr_Elite", "Draugr"]
ranged = ["Skeleton_Mountains", "Draugr_Ranged"]
flying = ["Bat"]
elite = ["Draugr_Elite"]

[creatures.Plains]
melee = ["Goblin", "GoblinBrute"]
ranged = ["GoblinArcher", "GoblinShaman"]
flying = ["Deathsquito"]
elite = ["GoblinBrute"]

[creatures.Mistlands]
melee = ["Seeker", "Tick", "SeekerBrute"]
flying = ["Seeker"]
elite = ["SeekerBrute"]

[creatures.AshLands]
melee = ["Charred_Melee", "Charred_Twitcher"]
ranged = ["Charred_Archer", "Charred_Mage"]
flying = ["Volture"]
elite = ["Charred_Melee"]

[creatures.DeepNorth]
melee = ["Skeleton_DeepNorth", "GoblinDeepNorth", "Greydwarf_Frozen"]
ranged = ["Greydwarf_Shaman_Frozen"]
flying = ["Bat"]
elite = ["GoblinDeepNorth"]

[creatures.default]
melee = ["Skeleton_NoArcher", "Skeleton_Poison"]
ranged = ["Skeleton"]
flying = ["Ghost"]
elite = ["Skeleton_Poison"]

