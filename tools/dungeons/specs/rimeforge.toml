# Rimeforge Depths: a frost-giants' smithy sealed under a glacier, its forges still smouldering in the ice. The rimeforge theme (tall
# forge-naves, black masonry under glacier ice, black iron ribs, ember light). On the way: a fight, the Frozen Forges (light three
# furnaces at once to melt the ice wall), a key wing and its gate, a timed bridge over a slag pit, the Bellows-Keeper (mini boss), a
# held gate, a drop, the Hammer Line (presses on a beat), the Rimesmith in the Great Forge, and the giants' hoard.
name = "rimeforge"
title = "$dungeons_pack_rimeforge"
theme = "rimeforge"
seed = 1
difficulty = "normal"
biome = "any"
environment = "Caves"
entrance_look = "rimeforge"
rooms = [16, 32]
max_size = [320, 140, 320]
min_uses = 4
music = "forestcrypt"
parkour = false
variants = 3

plan = [
  {id = "start", room = "entrance"},
  {id = "thaw", room = "frozenforges"},                               # (signature: the Frozen Forges)
  {id = "fight1", job = "fight"},
  {id = "hub1", job = "hub"},
  {id = "lever1", job = "lever", from = "hub1"},                       # a side wing: the key to the gate
  {id = "gate1", job = "gate", opens_with = "lever1", from = "hub1", variants = 4},
  {id = "timing1", job = "timing", variants = 4},
  {id = "keeper", room = "keeper"},                                    # (bosses_rimeforge: the Bellows-Keeper, the mini boss)
  {id = "plate1", job = "plate"},
  {id = "drop1", job = "drop"},
  {id = "hammers", room = "hammerline"},                              # (signature: the Hammer Line)
  {id = "smith", room = "greatforge"},                                 # (bosses_rimeforge: the Rimesmith)
  {id = "vault", room = "vault"},
]

signatures = ["slagbridge", "quenchhall", "secret_hoard", "cap_plain", "cap_ice", "vault_cap"]

[fill]
breather = 4
pillarhall = 3
machineroom = 3
corridor = 2
stairhall = 2
nook = 4
twolevers = 1
ambush = 1
timeddoor = 1

# Enemies by land: the game's own for each, with the smithy's own touches where the land allows (Surtlings at the swamp's forges,
# stone golems and drakes in the mountains); never above the land's tier (the builder checks).
[creatures.Meadows]
melee = ["Greyling", "Skeleton_Meadows_noarcher"]
ranged = ["Skeleton_Meadows"]
elite = ["Skeleton_Meadows_noarcher"]

[creatures.BlackForest]
melee = ["Skeleton_NoArcher", "Greydwarf", "Greydwarf_Elite"]
ranged = ["Skeleton", "Greydwarf_Shaman"]
flying = ["Ghost"]
elite = ["Troll"]

[creatures.Swamp]
melee = ["Draugr", "Draugr_Elite", "Surtling"]
ranged = ["Draugr_Ranged", "Skeleton_Swamps"]
flying = ["Wraith"]
elite = ["Draugr_Elite"]

[creatures.Mountain]
melee = ["Ulv", "Fenring", "Skeleton_Mountains_noarcher"]
ranged = ["Fenring_Cultist"]
flying = ["Hatchling"]
elite = ["StoneGolem", "Fenring"]

[creatures.Plains]
melee = ["Goblin", "GoblinBrute"]
ranged = ["GoblinArcher", "GoblinShaman"]
flying = ["Deathsquito"]
elite = ["GoblinBrute"]

[creatures.Mistlands]
melee = ["Seeker", "Tick", "SeekerBrute"]
flying = ["Seeker"]
elite = ["SeekerBrute"]

[creatures.AshLands]
melee = ["Charred_Melee", "Charred_Twitcher"]
ranged = ["Charred_Archer", "Charred_Mage"]
flying = ["Volture"]
elite = ["Charred_Melee"]

[creatures.DeepNorth]
melee = ["Skeleton_DeepNorth", "GoblinDeepNorth", "Greydwarf_Frozen"]
ranged = ["Greydwarf_Shaman_Frozen"]
flying = ["Bat"]
elite = ["GoblinDeepNorth"]

[creatures.Ocean]
melee = ["Greyling", "Skeleton_Meadows_noarcher"]
ranged = ["Skeleton_Meadows"]
elite = ["Skeleton_Meadows_noarcher"]

[creatures.default]
melee = ["Skeleton_NoArcher", "Greydwarf", "Greydwarf_Elite"]
ranged = ["Skeleton", "Greydwarf_Shaman"]
flying = ["Ghost"]
elite = ["Troll"]

