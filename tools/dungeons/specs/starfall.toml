# The Starfall Orrery: a sky-watchers' observatory built into the crater where a star fell (theme "orrery").
name = "starfall"
title = "$dungeons_pack_starfall"
theme = "orrery"
seed = 6
difficulty = "normal"
biome = "any"
environment = "Caves"
entrance_look = "starfall"
rooms = [14, 28]
max_size = [480, 160, 480]
min_uses = 6
music = "forestcrypt"
parkour = false
variants = 2

plan = [
  {id = "start", room = "entrance"},
  {id = "fight1", job = "fight"},
  {id = "hub1", job = "hub"},
  {id = "lever1", job = "lever", from = "hub1"},
  {id = "gate1", room = "gatehouse", opens_with = "lever1", from = "hub1"},
  {id = "chart", rooms = ["chart_a", "chart_b", "chart_c"]},
  {id = "timing1", job = "timing"},
  {id = "astrolabe", room = "astrolabe"},
  {id = "plate1", job = "plate"},
  {id = "orrery", rooms = ["orrery_a", "orrery_b"]},
  {id = "drop1", job = "drop"},
  {id = "suneater", room = "eclipse"},
  {id = "vault", room = "vault"},
]

signatures = ["passage_bend", "passage_riser", "cap_seal", "cap_fallen", "secret_lens", "vault_cap", "shortcut_near", "shortcut_far"]

[fill]
breather = 5
pillarhall = 3
machineroom = 3
corridor = 3
stairhall = 2
nook = 4
twolevers = 1
ambush = 1
timeddoor = 1

[shortcut]
near = "shortcut_near"
far = "shortcut_far"
far_step = "astrolabe"

# Enemies by the entrance's land (never above its tier: the builder swaps anything stronger): the watchers' dead and what haunts a
# fallen star; ghosts and wraiths where the land has them, the Mountain's cultists for the star-cult feel.
[creatures.Meadows]
melee = ["Skeleton_Meadows_noarcher", "Greyling"]
ranged = ["Skeleton_Meadows"]
elite = ["Skeleton_Meadows_noarcher"]

[creatures.BlackForest]
melee = ["Skeleton_NoArcher", "Greydwarf_Elite", "Greydwarf"]
ranged = ["Skeleton", "Greydwarf_Shaman"]
flying = ["Ghost"]
elite = ["Troll"]

[creatures.Swamp]
melee = ["Draugr", "Skeleton_Swamps_noarcher", "Draugr_Elite"]
ranged = ["Draugr_Ranged", "Skeleton_Swamps"]
flying = ["Wraith", "Ghost"]
elite = ["Draugr_Elite"]

[creatures.Mountain]
melee = ["Fenring", "Skeleton_Mountains_noarcher", "Ulv"]
ranged = ["Fenring_Cultist", "Skeleton_Mountains"]
flying = ["Hatchling", "Bat"]
elite = ["Fenring"]

[creatures.Plains]
melee = ["Goblin", "GoblinBrute"]
ranged = ["GoblinShaman", "GoblinArcher"]
flying = ["Deathsquito"]
elite = ["GoblinBrute"]

[creatures.Mistlands]
melee = ["Seeker", "SeekerBrute", "Tick"]
flying = ["Seeker"]
elite = ["SeekerBrute"]

[creatures.AshLands]
melee = ["Charred_Melee", "Charred_Twitcher"]
ranged = ["Charred_Mage", "Charred_Archer"]
flying = ["Volture"]
elite = ["Charred_Melee"]

[creatures.DeepNorth]
melee = ["Skeleton_DeepNorth", "Greydwarf_Frozen", "GoblinDeepNorth"]
ranged = ["Greydwarf_Shaman_Frozen"]
flying = ["Bat"]
elite = ["GoblinDeepNorth"]

[creatures.Ocean]
melee = ["Skeleton_Meadows_noarcher", "Greyling"]
ranged = ["Skeleton_Meadows"]
elite = ["Skeleton_Meadows_noarcher"]

[creatures.default]
melee = ["Skeleton_NoArcher", "Greydwarf_Elite"]
ranged = ["Skeleton", "Greydwarf_Shaman"]
flying = ["Ghost"]
elite = ["Troll"]

# Loot by land: the watchers kept what shines: amber, pearls, rubies, crystal and silver where the land has them, coins always.
[loot.Meadows]
common = ["Coins:5-15", "Amber", "Flint:2-5", "Feathers:2-6"]
rare = ["Coins:15-30", "Amber:1-2", "AmberPearl", "Flint:4-8"]
vault = ["Coins:60-100", "Amber:2-4", "AmberPearl:1-2", "Ruby:1-2", "ArrowFlint:20-40"]
boss = ["Coins:100-150", "AmberPearl:2-3", "Ruby:2-3", "Amber:3-5"]

[loot.BlackForest]
common = ["Coins:10-20", "Amber", "Resin:3-6", "GreydwarfEye:2-4"]
rare = ["Coins:20-40", "AmberPearl", "Ruby", "SurtlingCore", "Tin:2-3"]
vault = ["Coins:80-140", "Ruby:2-4", "AmberPearl:2-3", "SurtlingCore:3-5", "Bronze:4-8", "ArrowBronze:20-30"]
boss = ["Coins:150-220", "Ruby:3-5", "AmberPearl:3-4", "Bronze:8-12"]

[loot.Swamp]
common = ["Coins:15-30", "Amber", "AmberPearl", "WitheredBone"]
rare = ["Coins:30-60", "IronScrap:3-6", "Ruby", "AmberPearl:1-2"]
vault = ["Coins:120-200", "Iron:5-8", "Ruby:3-5", "AmberPearl:3-4", "Chain:2-3"]
boss = ["Coins:200-300", "Iron:8-12", "Ruby:4-6", "AmberPearl:4-5"]

[loot.Mountain]
common = ["Coins:20-40", "Obsidian:3-6", "Crystal:1-2", "Ruby"]
rare = ["Coins:40-80", "SilverOre:3-6", "Crystal:2-4", "AmberPearl:1-2"]
vault = ["Coins:160-260", "Silver:6-10", "Crystal:4-8", "Ruby:4-6", "SilverNecklace:1-2"]
boss = ["Coins:260-380", "Silver:10-14", "Crystal:6-10", "SilverNecklace:2-3"]
