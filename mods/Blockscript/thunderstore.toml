# Thunderstore package for this mod, read by the Thunderstore CLI (tcli build, tcli publish). Made by Claude Tools' modkit package,
# which keeps versionNumber and the dependencies up to date from the DLL; everything else is yours to edit.
[config]
schemaVersion = "0.0.1"

[package]
namespace = "Quads_Lab"
name = "Quads_Blockscript"
versionNumber = "0.1.1"
description = "Scratch-style visual scripting (block coding): snap blocks into events, quests, minigames and server rules. No-code automation and admin tools, or write JavaScript. Safe sandbox with limits, live co-editing, runs on the server."
websiteUrl = "https://github.com/HardHeadHackerHead/valheim-mods/tree/main/mods/Blockscript"
containsNsfwContent = false

[package.dependencies]
denikson-BepInExPack_Valheim = "5.4.2351"

[build]
icon = "./thunderstore/icon.png"
readme = "./thunderstore-build/README.md"
outdir = "./thunderstore-build"

[[build.copy]]
source = "./bin/Release/net48/Blockscript.dll"
target = "plugins/Blockscript.dll"

[[build.copy]]
source = "./thunderstore-build/CHANGELOG.md"
target = "CHANGELOG.md"

[publish]
repository = "https://thunderstore.io"
communities = [ "valheim" ]

[publish.categories]
valheim = [ "mods", "tools", "utility", "server-side", "client-side", "deep-north-update", "ai-generated" ]
