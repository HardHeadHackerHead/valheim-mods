# Thunderstore package for this mod, read by the Thunderstore CLI (tcli build, tcli publish). Made by hand like the others (modkit package
# keeps versionNumber and the dependencies up to date from the DLL). Not on Thunderstore yet: GitHub and the F7 feed only.
[config]
schemaVersion = "0.0.1"

[package]
namespace = "Quads_Lab"
name = "Quads_Rocket_Roadster"
versionNumber = "0.1.0"
description = "A flying sports car: a white wedge two-seater with cold-air thrusters. It hops, flies for a few seconds, barrel rolls and flips, and attitude jets land it on its wheels. Built with the hammer."
websiteUrl = "https://github.com/HardHeadHackerHead/valheim-mods/tree/main/mods/RocketRoadster"
containsNsfwContent = false

[package.dependencies]
denikson-BepInExPack_Valheim = "5.4.2351"

[build]
icon = "./thunderstore/icon.png"
readme = "./thunderstore-build/README.md"
outdir = "./thunderstore-build"

[[build.copy]]
source = "./bin/Release/net48/RocketRoadster.dll"
target = "plugins/RocketRoadster.dll"

[[build.copy]]
source = "./thunderstore-build/CHANGELOG.md"
target = "CHANGELOG.md"

[publish]
repository = "https://thunderstore.io"
communities = [ "valheim" ]

[publish.categories]
valheim = [ "mods", "vehicles", "transportation", "server-side", "client-side", "ai-generated" ]
