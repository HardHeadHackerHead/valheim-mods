# Thunderstore package for this mod, read by the Thunderstore CLI (tcli build, tcli publish). Made by Claude Tools' modkit package,
# which keeps versionNumber and the dependencies up to date from the DLL; everything else is yours to edit.
[config]
schemaVersion = "0.0.1"

[package]
namespace = "Quads_Lab"
name = "Quads_Four_Wheelers"
versionNumber = "0.1.0"
description = "Four wheeler (ATV, quad bike) for a rider and a passenger: a fast all-terrain vehicle driven by a surtling core. Springs, headlights, tail lights, rack storage, paint colours, engine sound and dust. Built with the hammer."
websiteUrl = "https://github.com/HardHeadHackerHead/valheim-mods/tree/main/mods/FourWheelers"
containsNsfwContent = false

[package.dependencies]
denikson-BepInExPack_Valheim = "5.4.2351"

[build]
icon = "./thunderstore/icon.png"
readme = "./thunderstore-build/README.md"
outdir = "./thunderstore-build"

[[build.copy]]
source = "./bin/Release/net48/FourWheelers.dll"
target = "plugins/FourWheelers.dll"

[[build.copy]]
source = "./thunderstore-build/CHANGELOG.md"
target = "CHANGELOG.md"

[publish]
repository = "https://thunderstore.io"
communities = [ "valheim" ]

[publish.categories]
valheim = [ "mods", "vehicles", "transportation", "server-side", "client-side", "deep-north-update", "ai-generated" ]
