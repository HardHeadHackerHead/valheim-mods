# Thunderstore package for this mod, read by the Thunderstore CLI (tcli build, tcli publish). Made by Claude Tools' modkit package,
# which keeps versionNumber and the dependencies up to date from the DLL; everything else is yours to edit.
[config]
schemaVersion = "0.0.1"

[package]
namespace = "Quads_Lab"
name = "Quads_Guns"
versionNumber = "0.2.0"
description = "Firearms and guns: pistol, revolver, dual pistols, SMG, shotgun, rifle, lever action, AR-15, sniper, machine gun and minigun, with reloading, aiming down the sights, recoil, real gun sounds and diving while you shoot. Made at the forge."
websiteUrl = "https://github.com/HardHeadHackerHead/valheim-mods/tree/main/mods/Guns"
containsNsfwContent = false

[package.dependencies]
denikson-BepInExPack_Valheim = "5.4.2351"

[build]
icon = "./thunderstore/icon.png"
readme = "./thunderstore-build/README.md"
outdir = "./thunderstore-build"

[[build.copy]]
source = "./bin/Release/net48/Guns.dll"
target = "plugins/Guns.dll"

[[build.copy]]
source = "./thunderstore-build/CHANGELOG.md"
target = "CHANGELOG.md"

[publish]
repository = "https://thunderstore.io"
communities = [ "valheim" ]

[publish.categories]
valheim = [ "mods", "gear", "crafting", "client-side", "server-side", "deep-north-update", "ai-generated" ]
