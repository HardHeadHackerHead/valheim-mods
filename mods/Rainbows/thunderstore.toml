# Thunderstore package for this mod, read by the Thunderstore CLI (tcli build, tcli publish). Made by Claude Tools' modkit package,
# which keeps versionNumber and the dependencies up to date from the DLL; everything else is yours to edit.
[config]
schemaVersion = "0.0.1"

[package]
namespace = "Quads_Lab"
name = "Quads_Rainbows"
versionNumber = "0.3.1"
description = "A rainbow in the sky after the rain (now and then a double rainbow), and a blessing for looking up at it: faster stamina and health regen. Weather and sky that give something back. Only you need it."
websiteUrl = "https://github.com/HardHeadHackerHead/valheim-mods/tree/main/mods/Rainbows"
containsNsfwContent = false

[package.dependencies]
denikson-BepInExPack_Valheim = "5.4.2351"

[build]
icon = "./thunderstore/icon.png"
readme = "./thunderstore-build/README.md"
outdir = "./thunderstore-build"

[[build.copy]]
source = "./bin/Release/net48/Rainbows.dll"
target = "plugins/Rainbows.dll"

[[build.copy]]
source = "./thunderstore-build/CHANGELOG.md"
target = "CHANGELOG.md"

[publish]
repository = "https://thunderstore.io"
communities = [ "valheim" ]

[publish.categories]
valheim = [ "mods", "misc", "client-side", "deep-north-update", "ai-generated" ]
