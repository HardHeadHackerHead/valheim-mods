# Thunderstore package for this mod, read by the Thunderstore CLI (tcli build, tcli publish). Made by Claude Tools' modkit package,
# which keeps versionNumber and the dependencies up to date from the DLL; everything else is yours to edit.
[config]
schemaVersion = "0.0.1"

[package]
namespace = "Quads_Lab"
name = "Quads_Craft_From_Chests"
versionNumber = "1.5.3"
description = "Craft from chests and containers: crafting stations and hand-crafting use materials from nearby chests (20 m, or your own range), with totals in the crafting menu and lines to the chests in use. Pairs with Build From Chests."
websiteUrl = "https://github.com/HardHeadHackerHead/valheim-mods/tree/main/mods/CraftFromChests"
containsNsfwContent = false

[package.dependencies]
denikson-BepInExPack_Valheim = "5.4.2351"

[build]
icon = "./thunderstore/icon.png"
readme = "./thunderstore-build/README.md"
outdir = "./thunderstore-build"

[[build.copy]]
source = "./bin/Release/net48/CraftFromChests.dll"
target = "plugins/CraftFromChests.dll"

[[build.copy]]
source = "./thunderstore-build/CHANGELOG.md"
target = "CHANGELOG.md"

[publish]
repository = "https://thunderstore.io"
communities = [ "valheim" ]

[publish.categories]
valheim = [ "mods", "crafting", "utility", "tweaks", "client-side", "deep-north-update", "ai-generated" ]
