# Thunderstore package for this mod, read by the Thunderstore CLI (tcli build, tcli publish). Made by Claude Tools' modkit package,
# which keeps versionNumber and the dependencies up to date from the DLL; everything else is yours to edit.
[config]
schemaVersion = "0.0.1"

[package]
namespace = "Quads_Lab"
name = "Quads_Party_HUD"
versionNumber = "1.10.0"
description = "A party HUD: health bars, stamina and distance for every player in your group, live and at any range, on the right of the screen."
websiteUrl = "https://github.com/HardHeadHackerHead/valheim-mods/tree/main/mods/PartyHud"
containsNsfwContent = false

[package.dependencies]
denikson-BepInExPack_Valheim = "5.4.2351"

[build]
icon = "./thunderstore/icon.png"
readme = "./thunderstore-build/README.md"
outdir = "./thunderstore-build"

[[build.copy]]
source = "./bin/Release/net48/PartyHud.dll"
target = "plugins/PartyHud.dll"

[[build.copy]]
source = "./thunderstore-build/CHANGELOG.md"
target = "CHANGELOG.md"

[publish]
repository = "https://thunderstore.io"
communities = [ "valheim" ]

[publish.categories]
valheim = [ "mods", "utility", "tweaks", "client-side", "deep-north-update", "ai-generated" ]
