# Thunderstore package for this mod, read by the Thunderstore CLI (tcli build, tcli publish). Made by Claude Tools' modkit package,
# which keeps versionNumber and the dependencies up to date from the DLL; everything else is yours to edit.
[config]
schemaVersion = "0.0.1"

[package]
namespace = "Quads_Lab"
name = "Quads_Skal_Tavern"
versionNumber = "0.5.1"
description = "Ale and mead that get you drunk: beer, mead and wine brewed in the cauldron, drunk effects (tipsy, stumbling, a hangover), and a Skål! toast with your friends for a buff. Alcohol and a tavern night for your vikings."
websiteUrl = "https://github.com/HardHeadHackerHead/valheim-mods/tree/main/mods/SkalTavern"
containsNsfwContent = false

[package.dependencies]
denikson-BepInExPack_Valheim = "5.4.2351"

[build]
icon = "./thunderstore/icon.png"
readme = "./thunderstore-build/README.md"
outdir = "./thunderstore-build"

[[build.copy]]
source = "./bin/Release/net48/SkalTavern.dll"
target = "plugins/SkalTavern.dll"

[[build.copy]]
source = "./thunderstore-build/CHANGELOG.md"
target = "CHANGELOG.md"

[publish]
repository = "https://thunderstore.io"
communities = [ "valheim" ]

[publish.categories]
valheim = [ "mods", "crafting", "misc", "client-side", "server-side", "deep-north-update", "ai-generated" ]
