# Thunderstore package for this mod, read by the Thunderstore CLI (tcli build, tcli publish). Made by Claude Tools' modkit package,
# which keeps versionNumber and the dependencies up to date from the DLL; everything else is yours to edit.
[config]
schemaVersion = "0.0.1"

[package]
namespace = "Quads_Lab"
name = "Quads_Crafting_Filters"
versionNumber = "0.2.1"
description = "Recipe filter chips above the crafting list: pick a type, a tier or what you can make now, at every crafting station."
websiteUrl = "https://github.com/HardHeadHackerHead/valheim-mods/tree/main/mods/BetterCraftingStations"
containsNsfwContent = false

[package.dependencies]
denikson-BepInExPack_Valheim = "5.4.2351"

[build]
icon = "./thunderstore/icon.png"
readme = "./thunderstore-build/README.md"
outdir = "./thunderstore-build"

[[build.copy]]
source = "./bin/Release/net48/BetterCraftingStations.dll"
target = "plugins/BetterCraftingStations.dll"

[[build.copy]]
source = "./thunderstore-build/CHANGELOG.md"
target = "CHANGELOG.md"

[publish]
repository = "https://thunderstore.io"
communities = [ "valheim" ]

[publish.categories]
valheim = [ "mods", "crafting", "tweaks", "client-side", "deep-north-update", "ai-generated" ]
