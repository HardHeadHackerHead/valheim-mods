# Thunderstore package for this mod, read by the Thunderstore CLI (tcli build, tcli publish). Made by Claude Tools' modkit package,
# which keeps versionNumber and the dependencies up to date from the DLL; everything else is yours to edit.
[config]
schemaVersion = "0.0.1"

[package]
namespace = "Quads_Lab"
name = "Quads_Cigars"
versionNumber = "0.4.2"
description = "Grow tobacco, cure it, roll your own cigars and smoke them for buffs: farm wild tobacco plants, dry and age the leaves, build a rolling table and a humidor, and light up. Smoking as a real part of the game, with smoke others see."
websiteUrl = "https://github.com/HardHeadHackerHead/valheim-mods/tree/main/mods/CigarSmoking"
containsNsfwContent = false

[package.dependencies]
denikson-BepInExPack_Valheim = "5.4.2351"

[build]
icon = "./thunderstore/icon.png"
readme = "./thunderstore-build/README.md"
outdir = "./thunderstore-build"

[[build.copy]]
source = "./bin/Release/net48/CigarSmoking.dll"
target = "plugins/CigarSmoking.dll"

[[build.copy]]
source = "./thunderstore-build/CHANGELOG.md"
target = "CHANGELOG.md"

[publish]
repository = "https://thunderstore.io"
communities = [ "valheim" ]

[publish.categories]
valheim = [ "mods", "crafting", "building", "misc", "client-side", "server-side", "deep-north-update", "ai-generated" ]
