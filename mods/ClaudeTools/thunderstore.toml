# Thunderstore package for this mod, read by the Thunderstore CLI (tcli build, tcli publish). Made by Claude Tools' modkit package,
# which keeps versionNumber and the dependencies up to date from the DLL; everything else is yours to edit.
[config]
schemaVersion = "0.0.1"

[package]
namespace = "Quads_Lab"
name = "Quads_AI_Mod_Toolkit"
versionNumber = "1.2.2"
description = "For Claude Code and other AI assistants: see your game and make mods that work with other mods: pictures, the game's real code, a pre-release check, clash reports and safe reloading. Works through files on your PC; no network port."
websiteUrl = "https://github.com/HardHeadHackerHead/valheim-mods/tree/main/mods/ClaudeTools"
containsNsfwContent = false

[package.dependencies]
denikson-BepInExPack_Valheim = "5.4.2351"

[build]
icon = "./thunderstore/icon.png"
readme = "./thunderstore-build/README.md"
outdir = "./thunderstore-build"

[[build.copy]]
source = "./bin/Release/net48/ClaudeTools.dll"
target = "plugins/ClaudeTools.dll"

[[build.copy]]
source = "./thunderstore-build/CHANGELOG.md"
target = "CHANGELOG.md"

[publish]
repository = "https://thunderstore.io"
communities = [ "valheim" ]

[publish.categories]
valheim = [ "mods", "tools", "utility", "ai-generated" ]
