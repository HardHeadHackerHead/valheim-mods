# Thunderstore package for this mod, read by the Thunderstore CLI (tcli build, tcli publish). Made by Claude Tools' modkit package,
# which keeps versionNumber and the dependencies up to date from the DLL; everything else is yours to edit.
[config]
schemaVersion = "0.0.1"

[package]
namespace = "Quads_Lab"
name = "Quads_Ziplines"
versionNumber = "0.2.1"
description = "Ziplines: build two posts, run a rope between them and ride it, hanging from your axe."
websiteUrl = "https://github.com/HardHeadHackerHead/valheim-mods/tree/main/mods/Ziplines"
containsNsfwContent = false

[package.dependencies]
denikson-BepInExPack_Valheim = "5.4.2351"

[build]
icon = "./thunderstore/icon.png"
readme = "./thunderstore-build/README.md"
outdir = "./thunderstore-build"

[[build.copy]]
source = "./bin/Release/net48/Ziplines.dll"
target = "plugins/Ziplines.dll"

[[build.copy]]
source = "./thunderstore-build/CHANGELOG.md"
target = "CHANGELOG.md"

[publish]
repository = "https://thunderstore.io"
communities = [ "valheim" ]

[publish.categories]
valheim = [ "mods", "building", "transportation", "ai-generated" ]
