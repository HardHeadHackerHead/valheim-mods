# Thunderstore package for this mod, read by the Thunderstore CLI (tcli build, tcli publish). Made by Claude Tools' modkit package,
# which keeps versionNumber and the dependencies up to date from the DLL; everything else is yours to edit.
[config]
schemaVersion = "0.0.1"

[package]
namespace = "Quads_Lab"
name = "Quads_Feed_From_Chests"
versionNumber = "1.6.1"
description = "Smelters, kilns, cooking racks, fires and fermenters can use items from nearby chests, and smelters and kilns can run themselves."
websiteUrl = "https://github.com/HardHeadHackerHead/valheim-mods/tree/main/mods/FeedFromChests"
containsNsfwContent = false

[package.dependencies]
denikson-BepInExPack_Valheim = "5.4.2351"

[build]
icon = "./thunderstore/icon.png"
readme = "./thunderstore-build/README.md"
outdir = "./thunderstore-build"

[[build.copy]]
source = "./bin/Release/net48/FeedFromChests.dll"
target = "plugins/FeedFromChests.dll"

[[build.copy]]
source = "./thunderstore-build/CHANGELOG.md"
target = "CHANGELOG.md"

[publish]
repository = "https://thunderstore.io"
communities = [ "valheim" ]

[publish.categories]
valheim = [ "mods", "crafting", "utility", "ai-generated" ]
